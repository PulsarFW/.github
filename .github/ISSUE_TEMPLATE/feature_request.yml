name: Feature request
description: Propose a new capability or improvement
labels: ["enhancement"]
body:
  - type: input
    id: target
    attributes:
      label: Target resource(s)
      description: Which resource(s) would this live in? Leave blank if it's a new resource entirely.
      placeholder: e.g. pulsar_doors, pulsar_admin
  - type: textarea
    id: problem
    attributes:
      label: What's missing or painful today
      description: What can't you do right now, or what's clunky about the current behavior?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: Describe the behavior you want. Mockups, reference links, or example configs are welcome.
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: How much does this matter to your server
      options:
        - Nice to have
        - Would meaningfully improve workflow
        - Currently blocking something
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you're using today
      description: If you've hacked around this some other way, describe it.
  - type: textarea
    id: additional
    attributes:
      label: Anything else
