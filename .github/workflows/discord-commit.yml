name: Discord Commit

on:
  workflow_call:
    secrets:
      DISCORD_COMMIT_WEBHOOK:
        required: true

jobs:
  notify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.event.repository.html_url }}
        run: |
          DESCRIPTION=$(echo "$COMMITS_JSON" | jq -r '
            def typeEmoji(t):
              if t == "feat" then "🚀"
              elif t == "fix" then "🐛"
              elif t == "refactor" then "♻️"
              elif t == "chore" then "🔧"
              elif t == "docs" then "📝"
              elif t == "perf" then "⚡"
              elif t == "test" then "✅"
              elif t == "ci" then "👷"
              else "🔹" end;
            [.[] | (.message | split("\n")[0]) as $subject
              | ($subject | capture("^(?<type>[a-zA-Z]+)(\\(.*\\))?:\\s*(?<rest>.*)$")? // {type: null, rest: null}) as $c
              | "\(typeEmoji($c.type // "")) [`\(.id[0:7])`](\(.url)) \($c.rest // $subject) — \(.author.username)"
            ] | join("\n")
          ')

          curl -sf -H "Content-Type: application/json" -d "$(jq -n \
            --arg title "$REPO_NAME" \
            --arg url "$REPO_URL" \
            --arg desc "$DESCRIPTION" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 8141549}]}')" \
            "${{ secrets.DISCORD_COMMIT_WEBHOOK }}"
