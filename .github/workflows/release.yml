name: Create New Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      RELEASE_TOKEN:
        required: true

jobs:
  bump-version:
    name: Bump Manifest Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Bump manifest version
        env:
          TARGET_VERSION: ${{ inputs.version }}
        run: |
          node - <<'JS'
          const fs = require('fs');

          const version = process.env.TARGET_VERSION;
          const versionLine = `version '${version}'`;
          const manifest = fs.readFileSync('fxmanifest.lua', 'utf8');

          // resource already has a version line - most resources do, since
          // the fxmanifest header convention includes one
          let updated = manifest.replace(/^version\s+'.*'$/m, versionLine);

          // fallback for a resource that predates the header convention -
          // insert right after the url line rather than failing the run
          if (!updated.includes(versionLine)) {
            if (/^url\s+'.*'$/m.test(manifest)) {
              updated = manifest.replace(/^(url\s+'.*')$/m, `$1\n${versionLine}`);
            } else {
              console.error("No 'version' or 'url' line found in fxmanifest.lua - can't bump");
              process.exit(1);
            }
          }

          fs.writeFileSync('fxmanifest.lua', updated);
          console.log(`Bumped manifest version to ${version}`);
          JS

      - name: Push manifest change
        uses: EndBug/add-and-commit@v9
        with:
          add: fxmanifest.lua
          push: true
          message: "chore: bump manifest version to ${{ inputs.version }}"
          tag: ${{ inputs.version }}
          default_author: github_actions
