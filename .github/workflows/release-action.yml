name: release-action

on:
  workflow_call:
    inputs:
      tag:
        required: false
        type: string

permissions:
  contents: write

jobs:
  release-action:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Bundle files
        run: |
          rm -rf ./.github ./.vscode ./.git
          mkdir "./${{ github.event.repository.name }}"
          shopt -s extglob
          cp -r !("${{ github.event.repository.name }}") "${{ github.event.repository.name }}"
          zip -r "./${{ github.event.repository.name }}.zip" "./${{ github.event.repository.name }}"

      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ inputs.tag || github.ref_name }}
          # buckets commits since the last tag by conventional-commit prefix
          # (feat/fix/refactor/chore/etc) into changelog sections, plus a
          # contributors list - this is the actual auto-changelog behavior
          includeInvalidCommits: true
          useGitmojis: false
          writeToFile: false

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ inputs.tag || github.ref_name }}
          tag: ${{ inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: "${{ github.event.repository.name }}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}
