name: release-action

on:
  workflow_call:
    secrets:
      DISCORD_WEBHOOK:
        required: false

permissions:
  contents: write

jobs:
  release-action:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Bump manifest version
        env:
          TARGET_VERSION: ${{ github.ref_name }}
        run: |
          node - <<'JS'
          const fs = require('fs');

          const version = process.env.TARGET_VERSION;
          const versionLine = `version '${version}'`;
          const manifest = fs.readFileSync('fxmanifest.lua', 'utf8');

          let updated = manifest.replace(/^version\s+'.*'$/m, versionLine);

          if (!updated.includes(versionLine)) {
            if (/^url\s+'.*'$/m.test(manifest)) {
              updated = manifest.replace(/^(url\s+'.*')$/m, `$1\n${versionLine}`);
            } else {
              console.error("No 'version' or 'url' line found in fxmanifest.lua - can't bump");
              process.exit(1);
            }
          }

          fs.writeFileSync('fxmanifest.lua', updated);
          console.log(`Bumped manifest version to ${version}`);
          JS

      - name: Commit manifest bump
        uses: EndBug/add-and-commit@v9
        with:
          add: fxmanifest.lua
          push: true
          message: "chore: bump manifest version to ${{ github.ref_name }}"
          default_author: github_actions

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Bundle files
        run: |
          rm -rf ./.github ./.vscode ./.git
          mkdir "./${{ github.event.repository.name }}"
          shopt -s extglob
          cp -r !("${{ github.event.repository.name }}") "${{ github.event.repository.name }}"
          zip -r "./${{ github.event.repository.name }}.zip" "./${{ github.event.repository.name }}"

      - name: Generate changelog
        id: changelog
        uses: requarks/changelog-action@v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          includeInvalidCommits: true
          useGitmojis: false
          writeToFile: false

      - name: Create Release
        id: create_release
        uses: ncipollo/release-action@v1.14.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.changes }}
          artifacts: "${{ github.event.repository.name }}.zip"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord
        if: ${{ secrets.DISCORD_WEBHOOK != '' }}
        uses: SethCohen/github-releases-to-discord@v1.16.2
        with:
          webhook_url: ${{ secrets.DISCORD_WEBHOOK }}
          color: "8141549"
          username: "Pulsar Releases"
          avatar_url: "https://r2.fivemanage.com/GPYOH8Hq4GPyAY7czrgLe/pulsarbanner.png"
          content: "📦 New release published for **${{ github.event.repository.name }}**"
          footer_title: "Pulsar Framework"
          footer_icon_url: "https://r2.fivemanage.com/GPYOH8Hq4GPyAY7czrgLe/pulsarbanner.png"
          footer_timestamp: true
          reduce_headings: true
          release_name: ${{ github.ref_name }}
          release_body: ${{ steps.changelog.outputs.changes }}
          release_html_url: ${{ steps.create_release.outputs.html_url }}
